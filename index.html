      // Fix: Ensure window.fetch has both getter & setter to prevent errors from extensions/wrappers
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = typeof val === 'function' ? val : currentFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoFetch = Window.prototype.fetch ? Window.prototype.fetch.bind(window) : undefined;
              var currentProtoFetch = protoFetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentProtoFetch;
                },
                set: function(val) {
                  currentProtoFetch = typeof val === 'function' ? val : currentProtoFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
